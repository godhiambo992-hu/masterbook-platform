
name: MASTERBOOK Supabase Deployment

'on':
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MASTERBOOK
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Verify MASTERBOOK files
        run: |
          test -f supabase/config.toml
          test -f supabase/migrations/20261112160000_masterbook_resources.sql
          test -f supabase/migrations/20261112161000_masterbook_storage.sql
          echo "All MASTERBOOK migration files verified."
