
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10243e">

<title>MASTERBOOK Document Reader</title>

<style>
:root{
  --navy:#10243e;
  --blue:#1769aa;
  --gold:#e5ad42;
  --light:#eef2f7;
  --white:#fff;
  --text:#243449;
  --muted:#64748b;
  --border:#dce3eb;
  --red:#b83232;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--text);
}

header{
  background:var(--navy);
  color:white;
  padding:15px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

header strong{
  font-size:21px;
  letter-spacing:1px;
}

header strong span{color:var(--gold)}

header a{
  color:white;
  text-decoration:none;
}

main{
  max-width:1250px;
  margin:auto;
  padding:18px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  background:white;
  padding:15px;
  border-radius:9px;
  margin-bottom:13px;
  border:1px solid var(--border);
}

#documentTitle{
  font-weight:bold;
  font-size:17px;
  overflow-wrap:anywhere;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,.download{
  border:0;
  border-radius:6px;
  padding:11px 15px;
  background:var(--blue);
  color:white;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
  font-size:13px;
}

.download{background:var(--navy)}

button:hover,.download:hover{
  opacity:.9;
}

#status{
  background:#e4edf8;
  color:var(--navy);
  padding:13px;
  border-radius:7px;
  margin-bottom:13px;
  line-height:1.6;
  font-size:14px;
}

#status.error{
  background:#fde8e8;
  color:var(--red);
}

#status.success{
  background:#e4f5e9;
  color:#17683a;
}

#viewer{
  background:white;
  min-height:65vh;
  border:1px solid var(--border);
  border-radius:9px;
  padding:18px;
  overflow:auto;
}

#viewer iframe{
  width:100%;
  height:75vh;
  border:0;
  display:block;
}

#viewer img{
  display:block;
  max-width:100%;
  max-height:75vh;
  height:auto;
  margin:auto;
  object-fit:contain;
}

#viewer pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.7;
}

#viewer table{
  border-collapse:collapse;
  width:100%;
  font-size:14px;
  background:white;
}

#viewer td,#viewer th{
  border:1px solid var(--border);
  padding:8px;
  text-align:left;
  min-width:80px;
  overflow-wrap:anywhere;
}

#viewer th{
  background:#e8f1fb;
  position:sticky;
  top:0;
}

#viewer .document-content{
  max-width:900px;
  margin:auto;
  line-height:1.75;
  overflow-wrap:anywhere;
}

#viewer .document-content img{
  max-width:100%;
}

#viewer .document-content table{
  margin:15px 0;
}

.notice{
  max-width:850px;
  margin:30px auto;
  padding:25px;
  background:#f4f7fb;
  border:1px solid var(--border);
  border-radius:8px;
  line-height:1.7;
}

.sheet-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.sheet-tabs button{
  background:#64748b;
}

.sheet-tabs button.active{
  background:var(--blue);
}

.table-scroll{
  overflow:auto;
  max-width:100%;
  max-height:70vh;
}

.file-details{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.hidden{display:none!important}

footer{
  text-align:center;
  padding:22px 10px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:600px){
  main{padding:10px}
  .toolbar{align-items:stretch}
  #documentTitle{width:100%}
  .actions{width:100%}
  .actions a,.actions button{
    flex:1;
    text-align:center;
  }
  #viewer{
    padding:10px;
    min-height:60vh;
  }
  #viewer iframe{height:70vh}
}
</style>

<!-- Document rendering libraries -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

</head>

<body>

<header>
  <strong>MASTER<span>BOOK</span></strong>
  <a href="library.html">← Back to Library</a>
</header>

<main>

  <section class="toolbar">
    <div>
      <div id="documentTitle">MASTERBOOK Document Reader</div>
      <div id="fileDetails" class="file-details"></div>
    </div>

    <div class="actions">
      <a id="downloadLink" class="download" href="#">
        Download Original
      </a>
    </div>
  </section>

  <div id="status" role="status" aria-live="polite">
    Preparing your document...
  </div>

  <section id="viewer">
    <div class="notice">
      <strong>MASTERBOOK Document Reader</strong>
      <p>Your learning resource will appear here.</p>
    </div>
  </section>

</main>

<footer>
  © <span id="year"></span> MASTERBOOK. All rights reserved.
</footer>

<script>
(function(){

"use strict";

/* =========================================
   URL PARAMETERS
========================================= */

const params = new URLSearchParams(location.search);

const fileUrl = params.get("file");
const title = params.get("title") || "MASTERBOOK Resource";
const suppliedType = (params.get("type") || "").toLowerCase();

const titleElement =
  document.getElementById("documentTitle");

const fileDetails =
  document.getElementById("fileDetails");

const status =
  document.getElementById("status");

const viewer =
  document.getElementById("viewer");

const downloadLink =
  document.getElementById("downloadLink");

document.getElementById("year").textContent =
  new Date().getFullYear();


/* =========================================
   STATUS MANAGEMENT
========================================= */

function setStatus(message,type="normal"){
  status.textContent = message;
  status.className = "";

  if(type==="error"){
    status.classList.add("error");
  }

  if(type==="success"){
    status.classList.add("success");
  }
}


/* =========================================
   FILE TYPE DETECTION
========================================= */

const mimeExtensions = {
  "application/pdf":"pdf",
  "application/msword":"doc",
  "application/rtf":"rtf",
  "text/rtf":"rtf",
  "text/plain":"txt",
  "text/csv":"csv",
  "application/vnd.ms-excel":"xls",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"xlsx",
  "application/vnd.ms-powerpoint":"ppt",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation":"pptx",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document":"docx",
  "image/jpeg":"jpg",
  "image/png":"png",
  "image/gif":"gif",
  "image/webp":"webp",
  "image/svg+xml":"svg",
  "image/bmp":"bmp",
  "image/tiff":"tiff",
  "image/avif":"avif"
};

function getExtension(url){
  try{
    const pathname = new URL(url).pathname;
    const name = pathname.split("/").pop() || "";
    const dot = name.lastIndexOf(".");

    return dot >= 0
      ? name.substring(dot+1).toLowerCase()
      : "";
  }catch(e){
    return "";
  }
}

function normalizeExtension(value){
  const clean = value.split(";")[0].trim();

  if(mimeExtensions[clean]){
    return mimeExtensions[clean];
  }

  return clean.replace(/^\./,"").toLowerCase();
}


/* =========================================
   URL VALIDATION
========================================= */

function validFileUrl(value){
  try{
    const parsed = new URL(value);

    return (
      parsed.protocol === "https:" &&
      parsed.hostname === "bxsrhvcqjjtdnflhoplu.supabase.co" &&
      parsed.pathname.includes("/storage/v1/object/")
    );
  }catch(e){
    return false;
  }
}


/* =========================================
   DOWNLOAD ORIGINAL
========================================= */

function prepareDownload(){
  downloadLink.href = fileUrl;
  downloadLink.target = "_blank";
  downloadLink.rel = "noopener noreferrer";
}


/* =========================================
   SAFE DOM HELPERS
========================================= */

function createNotice(headingText,messageText,extraText=""){
  const box = document.createElement("div");
  box.className = "notice";

  const heading = document.createElement("h2");
  heading.textContent = headingText;

  const message = document.createElement("p");
  message.textContent = messageText;

  box.append(heading,message);

  if(extraText){
    const extra = document.createElement("p");
    extra.textContent = extraText;
    box.appendChild(extra);
  }

  viewer.replaceChildren(box);
}


/* =========================================
   FETCH FILE
========================================= */

async function fetchFile(){
  const response = await fetch(fileUrl);

  if(!response.ok){
    throw new Error(
      "Unable to retrieve the document. The signed link may have expired. Return to the Library and open the resource again."
    );
  }

  return response;
}


/* =========================================
   PDF READER
========================================= */

function showPDF(){
  const frame = document.createElement("iframe");

  frame.title = title;
  frame.src = fileUrl;
  frame.loading = "lazy";

  viewer.replaceChildren(frame);

  setStatus(
    "PDF document opened. If your browser does not display it, use Download Original."
  );
}


/* =========================================
   WORD DOCX READER
========================================= */

async function showDOCX(){
  setStatus("Loading Word document...");

  if(!window.mammoth){
    throw new Error("The Word rendering library could not load.");
  }

  const response = await fetchFile();
  const arrayBuffer = await response.arrayBuffer();

  const result = await window.mammoth.convertToHtml({
    arrayBuffer:arrayBuffer
  });

  const content = document.createElement("div");
  content.className = "document-content";

  if(window.DOMPurify){
    content.innerHTML = DOMPurify.sanitize(result.value);
  }else{
    throw new Error("Document security library could not load.");
  }

  viewer.replaceChildren(content);

  setStatus(
    "Word document opened successfully. Download Original to retain the original DOCX file.",
    "success"
  );
}


/* =========================================
   SPREADSHEET READER
   XLS, XLSX AND CSV
========================================= */

async function showSpreadsheet(extension){
  setStatus("Loading spreadsheet...");

  if(!window.XLSX){
    throw new Error("The spreadsheet rendering library could not load.");
  }

  const response = await fetchFile();

  let workbook;

  if(extension==="csv"){
    const csvText = await response.text();

    workbook = XLSX.read(csvText,{
      type:"string"
    });

  }else{
    const arrayBuffer = await response.arrayBuffer();

    workbook = XLSX.read(arrayBuffer,{
      type:"array"
    });
  }

  if(!workbook.SheetNames.length){
    createNotice(
      "Empty spreadsheet",
      "This file contains no worksheets."
    );
    return;
  }

  const tabs = document.createElement("div");
  tabs.className = "sheet-tabs";

  const tableContainer = document.createElement("div");
  tableContainer.className = "table-scroll";

  function renderSheet(name){
    const worksheet = workbook.Sheets[name];

    const rows = XLSX.utils.sheet_to_json(worksheet,{
      header:1,
      defval:"",
      raw:false,
      blankrows:true
    });

    const table = document.createElement("table");

    const limitedRows = rows.slice(0,5000);

    limitedRows.forEach((row,rowIndex)=>{
      const tr = document.createElement("tr");

      row.slice(0,100).forEach(cell=>{
        const cellElement = document.createElement(
          rowIndex===0 ? "th" : "td"
        );

        cellElement.textContent = String(cell ?? "");
        tr.appendChild(cellElement);
      });

      table.appendChild(tr);
    });

    tableContainer.replaceChildren(table);

    tabs.querySelectorAll("button").forEach(button=>{
      button.classList.toggle(
        "active",
        button.dataset.sheet===name
      );
    });
  }

  workbook.SheetNames.forEach(name=>{
    const button = document.createElement("button");

    button.type = "button";
    button.textContent = name;
    button.dataset.sheet = name;

    button.addEventListener("click",()=>{
      renderSheet(name);
    });

    tabs.appendChild(button);
  });

  viewer.replaceChildren(tabs,tableContainer);

  renderSheet(workbook.SheetNames[0]);

  setStatus(
    "Spreadsheet opened. Select a worksheet tab to view its contents.",
    "success"
  );
}


/* =========================================
   TEXT AND BASIC RTF READER
========================================= */

async function showText(extension){
  setStatus("Loading text document...");

  const response = await fetchFile();

  let content = await response.text();

  if(extension==="rtf"){
    content = content
      .replace(/\\par[d]?/g,"\n")
      .replace(/\\line/g,"\n")
      .replace(/\\tab/g,"\t")
      .replace(/\\'[0-9a-f]{2}/gi,"")
      .replace(/\\[a-z]+-?\d* ?/gi,"")
      .replace(/[{}]/g,"")
      .replace(/\n{3,}/g,"\n\n");
  }

  const pre = document.createElement("pre");
  pre.textContent = content;

  viewer.replaceChildren(pre);

  setStatus(
    extension==="rtf"
      ? "Basic RTF text extraction completed. Complex formatting may not be preserved."
      : "Text document opened successfully.",
    "success"
  );
}


/* =========================================
   IMAGE READER
========================================= */

function showImage(){
  const image = document.createElement("img");

  image.alt = title;
  image.src = fileUrl;
  image.loading = "eager";

  image.onload = function(){
    setStatus("Image opened successfully.","success");
  };

  image.onerror = function(){
    createNotice(
      "Image preview unavailable",
      "Your browser could not display this image format.",
      "Use Download Original to access the image."
    );

    setStatus("Unable to display this image.","error");
  };

  viewer.replaceChildren(image);
}


/* =========================================
   OFFICE ONLINE READER
   DOC, PPT, PPTX
========================================= */

function showOfficeOnline(extension){
  const box = document.createElement("div");
  box.className = "notice";

  const heading = document.createElement("h2");
  heading.textContent = "Microsoft Office document preview";

  const explanation = document.createElement("p");

  explanation.textContent =
    "This document is being opened through Microsoft's online viewer. The signed document URL will be shared with Microsoft to provide the preview.";

  const warning = document.createElement("p");

  warning.textContent =
    "Only use this preview for documents suitable for processing by an external service. If the preview does not load, download the original file.";

  const openLink = document.createElement("a");

  openLink.className = "download";
  openLink.textContent = "Open Microsoft Viewer";
  openLink.href =
    "https://view.officeapps.live.com/op/view.aspx?src=" +
    encodeURIComponent(fileUrl);

  openLink.target = "_blank";
  openLink.rel = "noopener noreferrer";

  box.append(heading,explanation,warning,openLink);

  viewer.replaceChildren(box);

  setStatus(
    extension.toUpperCase() +
    " document is ready for Microsoft Office online preview."
  );
}


/* =========================================
   UNSUPPORTED FORMATS
========================================= */

function showConversionNotice(extension){

  const details = {
    "tif":"TIFF images are not supported consistently by web browsers.",
    "tiff":"TIFF images are not supported consistently by web browsers.",
    "unknown":"This file type does not have a built-in browser preview.",
    "default":"This file requires a compatible preview or conversion service."
  };

  createNotice(
    "Preview unavailable",
    details[extension] || details.default,
    "The original file remains available through the Download Original button."
  );

  setStatus(
    "Original file available for download. Online preview is not available for this format."
  );
}


/* =========================================
   MAIN DOCUMENT ROUTER
========================================= */

async function openDocument(){

  titleElement.textContent = title;
  document.title = title + " | MASTERBOOK Reader";

  if(!fileUrl){
    throw new Error("No document link was supplied.");
  }

  if(!validFileUrl(fileUrl)){
    throw new Error("Invalid document address.");
  }

  prepareDownload();

  const extension =
    normalizeExtension(suppliedType) || getExtension(fileUrl);

  fileDetails.textContent =
    "File format: " + (extension ? extension.toUpperCase() : "Unknown");

  switch(extension){

    case "pdf":
      showPDF();
      break;

    case "docx":
      await showDOCX();
      break;

    case "xls":
    case "xlsx":
    case "csv":
      await showSpreadsheet(extension);
      break;

    case "txt":
    case "rtf":
      await showText(extension);
      break;

    case "doc":
    case "ppt":
    case "pptx":
      showOfficeOnline(extension);
      break;

    case "jpg":
    case "jpeg":
    case "png":
    case "webp":
    case "gif":
    case "bmp":
    case "svg":
    case "avif":
      showImage();
      break;

    case "tif":
    case "tiff":
      showConversionNotice(extension);
      break;

    default:
      showConversionNotice(extension || "unknown");
  }
}


/* =========================================
   START READER
========================================= */

openDocument().catch(error=>{

  console.error("MASTERBOOK Reader:",error);

  setStatus(
    "Unable to open document: " + error.message,
    "error"
  );

  createNotice(
    "Document could not be opened",
    error.message,
    "Return to the MASTERBOOK Library and try opening the resource again."
  );

});

})();
</script>

</body>
</html>
