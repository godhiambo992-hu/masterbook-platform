
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>Reset Password | MASTERBOOK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#102b50,#176b63);
 font-family:Arial,sans-serif;
 color:#172b4d;
}

.container{
 width:100%;
 max-width:450px;
 background:white;
 padding:30px;
 border-radius:16px;
 box-shadow:0 12px 35px #0003;
}

h1{
 color:#102b50;
 text-align:center;
 margin-top:0;
}

h2{color:#123b58}

p{
 line-height:1.6;
 color:#64748b;
}

label{
 display:block;
 margin-top:18px;
 font-weight:bold;
}

input{
 width:100%;
 padding:13px;
 margin-top:8px;
 border:1px solid #cbd5e1;
 border-radius:8px;
 font-size:16px;
}

input:focus{
 outline:2px solid #176b63;
 border-color:transparent;
}

button{
 width:100%;
 padding:14px;
 margin-top:22px;
 border:0;
 border-radius:8px;
 background:#176b63;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

#message{
 display:none;
 padding:13px;
 margin-top:18px;
 border-radius:8px;
 line-height:1.5;
 overflow-wrap:anywhere;
}

.success{
 display:block!important;
 background:#dcfce7;
 color:#166534;
}

.error{
 display:block!important;
 background:#fee2e2;
 color:#991b1b;
}

.hidden{display:none!important}

a{color:#176b63}

.footer{
 text-align:center;
 margin-top:24px;
 font-size:13px;
}
</style>
</head>

<body>

<div class="container">

 <h1>MASTERBOOK</h1>
 <h2>Reset your password</h2>

 <p id="instructions">
 Open the secure recovery link sent to your email.
 You can then create a new password for your account.
 </p>

 <form id="resetForm" class="hidden">

  <label for="password">New password</label>
  <input
   type="password"
   id="password"
   minlength="8"
   autocomplete="new-password"
   placeholder="Enter new password"
   required
  >

  <label for="confirmPassword">Confirm new password</label>
  <input
   type="password"
   id="confirmPassword"
   minlength="8"
   autocomplete="new-password"
   placeholder="Confirm new password"
   required
  >

  <button type="submit" id="saveButton">
   Update Password
  </button>

 </form>

 <div id="message" role="status" aria-live="polite"></div>

 <p class="footer">
  <a href="auth.html">Return to MASTERBOOK Login</a>
 </p>

</div>

<script>
"use strict";

/* MASTERBOOK SUPABASE CONFIGURATION */

const SUPABASE_URL =
 "https://bxsrhvcqjjtdnflhoplu.supabase.co";

/* This must match the key in auth.html */

const SUPABASE_KEY =
 "sb_publishable_DSUz-W5eeLBioVBQ1HywoQ_Rp4f3nur";

const LOGIN_URL =
 "https://godhiambo992-hu.github.io/masterbook-platform/auth.html";

/* INITIAL PAGE ELEMENTS */

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("saveButton");
const instructions = document.getElementById("instructions");

/* Detect whether this page was opened using a recovery link */

const initialURL = new URL(window.location.href);

const hasRecoveryCode =
 initialURL.searchParams.has("code");

const initialHash =
 window.location.hash || "";

const hasRecoveryToken =
 initialHash.includes("access_token=") &&
 initialHash.includes("type=recovery");

const hasRecoveryError =
 initialURL.searchParams.has("error") ||
 initialURL.searchParams.has("error_description") ||
 initialHash.includes("error=");

let recoveryReady = false;
let recoveryEventReceived = false;
let checkingRecovery = true;

/* DISPLAY MESSAGES */

function showMessage(text,type){

 message.textContent = text;
 message.className = type;
 message.style.display = "block";

}

function showResetForm(){

 form.classList.remove("hidden");

 instructions.textContent =
 "Your recovery link has been verified. Enter and confirm your new password.";

}

function setButton(disabled,text){

 button.disabled = disabled;
 button.textContent = text;

}

/* CHECK SUPABASE LIBRARY */

if(!window.supabase){

 showMessage(
  "MASTERBOOK could not load its authentication service. Check your internet connection and refresh.",
  "error"
 );

 throw new Error("Supabase library failed to load.");

}

/* CREATE SUPABASE CLIENT */

const client = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true,
   flowType:"pkce"
  }
 }
);

/*
 Listen for Supabase recovery events.
 Supabase processes the recovery code/token from the email link.
*/

const authListener = client.auth.onAuthStateChange(
 (event,session)=>{

  if(event === "PASSWORD_RECOVERY" && session){

   recoveryEventReceived = true;
   recoveryReady = true;

   showResetForm();

   showMessage(
    "Password recovery verified. You can now create a new password.",
    "success"
   );

  }

 }
);

/* HANDLE EMAIL LINK ERRORS */

function readRecoveryError(){

 const description =
  initialURL.searchParams.get("error_description");

 const code =
  initialURL.searchParams.get("error");

 if(description || code){

  return decodeURIComponent(
   String(description || code).replace(/\+/g," ")
  );

 }

 const hashParams =
  new URLSearchParams(initialHash.replace(/^#/,""));

 return hashParams.get("error_description") ||
        hashParams.get("error");

}

/* VERIFY RECOVERY SESSION */

async function checkRecoverySession(){

 try{

  if(hasRecoveryError){

   throw new Error(
    readRecoveryError() ||
    "The recovery link is invalid or has expired."
   );

  }

  if(!hasRecoveryCode && !hasRecoveryToken){

   throw new Error(
    "This page was not opened using a password recovery link. Request a fresh recovery email."
   );

  }

  /*
   getSession waits for Supabase initialization and
   allows the PKCE recovery code to be exchanged.
  */

  const {data,error} = await client.auth.getSession();

  if(error)throw error;

  if(!data.session){

   throw new Error(
    "Supabase could not verify your recovery session. The link may have expired or already been used. Request a new recovery email."
   );

  }

  /*
   A valid recovery link must have been opened.
   The URL must contain a recovery code or recovery token.
  */

  recoveryReady = true;

  showResetForm();

  showMessage(
   "Recovery session verified successfully. Enter your new password.",
   "success"
  );

 }catch(error){

  recoveryReady = false;

  showMessage(
   error.message ||
   "Unable to verify your password recovery link.",
   "error"
  );

 }finally{

  checkingRecovery = false;

 }

}

/* UPDATE PASSWORD */

form.addEventListener("submit",async function(event){

 event.preventDefault();

 if(checkingRecovery){

  showMessage(
   "Please wait while MASTERBOOK verifies your recovery link.",
   "error"
  );

  return;

 }

 if(!recoveryReady){

  showMessage(
   "Your recovery session is not valid. Request a new recovery email.",
   "error"
  );

  return;

 }

 const password =
  document.getElementById("password").value;

 const confirmPassword =
  document.getElementById("confirmPassword").value;

 if(password.length < 8){

  showMessage(
   "Your password must contain at least 8 characters.",
   "error"
  );

  return;

 }

 if(password !== confirmPassword){

  showMessage(
   "The two passwords do not match. Please check them.",
   "error"
  );

  return;

 }

 setButton(true,"Updating password...");

 try{

  const {data,error} = await client.auth.updateUser({
   password:password
  });

  if(error)throw error;

  if(!data.user){

   throw new Error(
    "The password update could not be confirmed."
   );

  }

  recoveryReady = false;

  form.reset();

  form.classList.add("hidden");

  showMessage(
   "Your MASTERBOOK password has been updated successfully. You can now return to the login page.",
   "success"
  );

  setTimeout(async()=>{

   await client.auth.signOut();

   window.location.replace(LOGIN_URL);

  },2500);

 }catch(error){

  showMessage(
   error.message ||
   "Password update failed. Please try again.",
   "error"
  );

  setButton(false,"Update Password");

 }

});

/* START RECOVERY VERIFICATION */

checkRecoverySession();

</script>

</body>
</html>
