
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>Reset Password | MASTERBOOK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#f1f5f9;
 font-family:Arial,sans-serif;
 color:#172b4d;
}
.container{
 width:100%;
 max-width:430px;
 background:white;
 padding:30px;
 border-radius:14px;
 box-shadow:0 8px 30px rgba(0,0,0,.08);
}
h1{color:#102b50;text-align:center}
p{line-height:1.6;color:#64748b}
label{display:block;margin-top:18px;font-weight:bold}
input{
 width:100%;
 padding:13px;
 margin-top:8px;
 border:1px solid #cbd5e1;
 border-radius:7px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:22px;
 border:0;
 border-radius:7px;
 background:#102b50;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{
 margin-top:18px;
 padding:12px;
 border-radius:7px;
 display:none;
 line-height:1.5;
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
a{color:#1d4ed8}
</style>
</head>

<body>
<div class="container">
 <h1>MASTERBOOK</h1>
 <h2>Reset your password</h2>
 <p>Enter a new password for your MASTERBOOK account.</p>

 <form id="resetForm">
  <label for="password">New password</label>
  <input
   type="password"
   id="password"
   minlength="8"
   autocomplete="new-password"
   placeholder="Enter new password"
   required
  >

  <label for="confirmPassword">Confirm new password</label>
  <input
   type="password"
   id="confirmPassword"
   minlength="8"
   autocomplete="new-password"
   placeholder="Confirm new password"
   required
  >

  <button type="submit" id="saveButton">
   Update Password
  </button>
 </form>

 <div id="message"></div>

 <p style="text-align:center;margin-top:22px">
  <a href="student.html">Return to MASTERBOOK</a>
 </p>
</div>

<script>
"use strict";

const SUPABASE_URL="https://bxsrhvcqjjtdnflhoplu.supabase.co";
const SUPABASE_KEY="sb_publishable_Hgg2m91Ht2OOWCUhH7sGrw_mC9yCj7S";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("resetForm");
const message=document.getElementById("message");
const button=document.getElementById("saveButton");

let recoveryReady=false;

function showMessage(text,type){
 message.textContent=text;
 message.className=type;
 message.style.display="block";
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY" && session){
  recoveryReady=true;
  showMessage("Recovery link verified. You can now set a new password.","success");
 }
});

async function checkRecoverySession(){
 const {data,error}=await db.auth.getSession();

 if(error){
  showMessage(error.message,"error");
  return;
 }

 if(data.session){
  recoveryReady=true;
  showMessage("Recovery session verified. Enter your new password.","success");
 }else{
  showMessage(
   "No valid recovery session was found. Your link may have expired. Request a new password recovery email.",
   "error"
  );
 }
}

checkRecoverySession();

form.addEventListener("submit",async function(event){
 event.preventDefault();

 const password=document.getElementById("password").value;
 const confirmPassword=document.getElementById("confirmPassword").value;

 if(!recoveryReady){
  showMessage("Please open a valid password recovery link from your email.","error");
  return;
 }

 if(password.length<8){
  showMessage("Your password must contain at least 8 characters.","error");
  return;
 }

 if(password!==confirmPassword){
  showMessage("The passwords do not match.","error");
  return;
 }

 button.disabled=true;
 button.textContent="Updating...";

 const {error}=await db.auth.updateUser({
  password:password
 });

 if(error){
  showMessage(error.message,"error");
  button.disabled=false;
  button.textContent="Update Password";
  return;
 }

 showMessage("Your password has been updated successfully. Redirecting to MASTERBOOK...","success");

 form.reset();

 setTimeout(()=>{
  window.location.href="student.html";
 },2500);
});
</script>
</body>
</html>
